<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      background: #000;               
    }
    canvas {
      border: 4px solid #222;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
      background: #000;              
    }
  </style>
</head>
<body>

<canvas id="canvas" width="480" height="480"></canvas>

<script>
  let canvas = document.getElementById('canvas');
  let ctx    = canvas.getContext('2d');

  let rows   = 20;
  let cols   = 20;
  let snake  = [{ x: 19, y: 3 }];
  let food;
  let cellW  = canvas.width  / cols;
  let cellH  = canvas.height / rows;
  let direction     = 'LEFT';
  let foodCollected = false;

  placeFood();
  setInterval(gameLoop, 200);
  document.addEventListener('keydown', keyDown);
  requestAnimationFrame(draw);   

  function draw() {
    
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#013220');
    grad.addColorStop(1, '#001810');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

   
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 1; i < cols; i++) {
      let x = i * cellW;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    for (let j = 1; j < rows; j++) {
      let y = j * cellH;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }

   
    snake.forEach((part, idx) => {
      let x = part.x * cellW,
          y = part.y * cellH;
      ctx.fillStyle = idx === 0 ? '#a0ff4c' : '#33cc33';  
      ctx.fillRect(x + 1, y + 1, cellW - 2, cellH - 2);
    });

    let fx = food.x * cellW + cellW/2;
    let fy = food.y * cellH + cellH/2;
    let r  = Math.min(cellW, cellH)/2 - 3;
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(fx, fy, r, 0, Math.PI*2);
    ctx.fill();
    ctx.closePath();

   
    ctx.fillStyle  = '#fff';
    ctx.font       = '20px sans-serif';
    ctx.textAlign  = 'left';
    ctx.fillText('Score: ' + (snake.length - 1), 10, 24);

    
    requestAnimationFrame(draw);
  }

  function gameLoop() {
    testGameOver();

    if (foodCollected) {
      snake.unshift({ x: snake[0].x, y: snake[0].y });
      foodCollected = false;
    }

    
    for (let i = snake.length - 1; i > 0; i--) {
      snake[i].x = snake[i-1].x;
      snake[i].y = snake[i-1].y;
    }

    
    if (direction === 'LEFT')  snake[0].x--;
    if (direction === 'RIGHT') snake[0].x++;
    if (direction === 'UP')    snake[0].y--;
    if (direction === 'DOWN')  snake[0].y++;

    
    if (snake[0].x === food.x && snake[0].y === food.y) {
      foodCollected = true;
      placeFood();
    }
  }

  function testGameOver() {
    let head = snake[0];
    
    if (
      head.x < 0 || head.x >= cols ||
      head.y < 0 || head.y >= rows
    ) {
      resetGame();
    }
    
    for (let i = 1; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        resetGame();
      }
    }
  }

  function resetGame() {
    placeFood();
    snake = [{ x: 19, y: 3 }];
    direction = 'LEFT';
  }

  function placeFood() {
    food = {
      x: Math.floor(Math.random() * cols),
      y: Math.floor(Math.random() * rows)
    };
  }

  function keyDown(e) {
    if (e.key === 'ArrowLeft'  && direction !== 'RIGHT') direction = 'LEFT';
    if (e.key === 'ArrowUp'    && direction !== 'DOWN')  direction = 'UP';
    if (e.key === 'ArrowRight' && direction !== 'LEFT')  direction = 'RIGHT';
    if (e.key === 'ArrowDown'  && direction !== 'UP')    direction = 'DOWN';
  }
</script>

</body>
</html>
